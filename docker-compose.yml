services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tradingpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  migrate:
    build: .
    working_dir: /app
    command: alembic upgrade head
    env_file: .env
    environment:
      PYTHONPATH: /app
    depends_on: [postgres, redis]
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on: [postgres, redis, migrate]
    ports:
      - "8000:8000"
  worker:
    build: .
    command: python -m workers.pipeline_worker
    env_file: .env
    depends_on: [postgres, redis, migrate]
