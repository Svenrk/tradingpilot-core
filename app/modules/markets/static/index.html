<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradingPilot Markets Dashboard</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171e2e;
    --border: #263048;
    --text: #e6ebf5;
    --muted: #8b96ad;
    --accent: #4f8cff;
    --up: #2ecc71;
    --down: #e74c3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 16px 24px 0;
  }
  h1 { margin: 0 0 12px; font-size: 20px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 10px 20px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .meta { padding: 8px 24px; color: var(--muted); font-size: 12px; }
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 0 24px 24px;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  section h2 {
    margin: 0;
    padding: 12px 16px;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  .table-wrap { max-height: 70vh; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 6px 12px; text-align: right; white-space: nowrap; }
  th:nth-child(-n+3), td:nth-child(-n+3) { text-align: left; }
  thead th {
    position: sticky;
    top: 0;
    background: var(--panel);
    color: var(--muted);
    font-weight: 500;
    font-size: 12px;
    border-bottom: 1px solid var(--border);
  }
  tbody tr:hover { background: rgba(79, 140, 255, 0.08); }
  td.name { color: var(--muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .status { padding: 24px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>TradingPilot Markets</h1>
  <div class="tabs" role="tablist">
    <button class="tab active" role="tab" data-market="crypto">Crypto</button>
    <button class="tab" role="tab" data-market="stocks">Stocks</button>
  </div>
</header>
<div class="meta" id="meta"></div>
<main>
  <section>
    <h2>Top 50 by 24h Volume</h2>
    <div class="table-wrap"><div id="volume-list" class="status">Loading…</div></div>
  </section>
  <section>
    <h2>Top 50 by 24h % Change</h2>
    <div class="table-wrap"><div id="change-list" class="status">Loading…</div></div>
  </section>
</main>
<script>
(function () {
  "use strict";
  var currentMarket = "crypto";
  var REFRESH_MS = 30000;
  var refreshTimer = null;

  function fmtPrice(value) {
    if (value >= 1000) return value.toLocaleString(undefined, { maximumFractionDigits: 2 });
    if (value >= 1) return value.toFixed(2);
    return value.toPrecision(4);
  }

  function fmtVolume(value) {
    if (value >= 1e9) return (value / 1e9).toFixed(2) + "B";
    if (value >= 1e6) return (value / 1e6).toFixed(2) + "M";
    if (value >= 1e3) return (value / 1e3).toFixed(2) + "K";
    return value.toFixed(0);
  }

  function renderTable(container, rows) {
    var table = document.createElement("table");
    var thead = document.createElement("thead");
    var headRow = document.createElement("tr");
    ["#", "Symbol", "Name", "Price", "24h %", "Volume"].forEach(function (label) {
      var th = document.createElement("th");
      th.textContent = label;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);
    var tbody = document.createElement("tbody");
    rows.forEach(function (row, index) {
      var tr = document.createElement("tr");
      var change = Number(row.change_percent) || 0;
      var cells = [
        String(index + 1),
        row.symbol,
        row.name || "",
        fmtPrice(Number(row.price) || 0),
        (change >= 0 ? "+" : "") + change.toFixed(2) + "%",
        fmtVolume(Number(row.volume) || 0)
      ];
      cells.forEach(function (text, cellIndex) {
        var td = document.createElement("td");
        td.textContent = text;
        if (cellIndex === 2) td.className = "name";
        if (cellIndex === 4) td.className = change >= 0 ? "up" : "down";
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    container.replaceChildren(table);
  }

  function showStatus(text) {
    ["volume-list", "change-list"].forEach(function (id) {
      var el = document.getElementById(id);
      var div = document.createElement("div");
      div.className = "status";
      div.textContent = text;
      el.replaceChildren(div);
    });
  }

  function load(market) {
    fetch("/api/v1/markets/" + market)
      .then(function (response) {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(function (data) {
        if (market !== currentMarket) return;
        renderTable(document.getElementById("volume-list"), data.top_by_volume || []);
        renderTable(document.getElementById("change-list"), data.top_by_change || []);
        document.getElementById("meta").textContent =
          "Source: " + data.source + " · Updated " + new Date().toLocaleTimeString();
      })
      .catch(function (error) {
        if (market !== currentMarket) return;
        showStatus("Failed to load market data (" + error.message + ")");
      });
  }

  function selectMarket(market) {
    currentMarket = market;
    document.querySelectorAll(".tab").forEach(function (tab) {
      tab.classList.toggle("active", tab.dataset.market === market);
    });
    showStatus("Loading…");
    load(market);
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(function () { load(currentMarket); }, REFRESH_MS);
  }

  document.querySelectorAll(".tab").forEach(function (tab) {
    tab.addEventListener("click", function () { selectMarket(tab.dataset.market); });
  });

  selectMarket("crypto");
})();
</script>
</body>
</html>
